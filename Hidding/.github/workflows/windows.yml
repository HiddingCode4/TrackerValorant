name: Build Hidding Windows
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install pyinstaller==6.16.0
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name Hidding --icon assets/hidding.ico --add-data "assets;assets" --add-data "demo.json;." app.py
      - uses: actions/upload-artifact@v4
        with:
          name: Hidding-Windows
          path: dist/Hidding.exe
